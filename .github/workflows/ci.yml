name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
        env:
          # Build-time no-op placeholders so `next build` doesn't fail before
          # Marketplace integrations provision real values in Vercel env vars.
          # Never used at runtime — see docs/DECISIONS.md.
          DATABASE_URL: "postgres://placeholder:placeholder@localhost:5432/placeholder"
          CLERK_SECRET_KEY: "sk_test_placeholder"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
